version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Disable in-process poller when using Celery Beat
      - ENABLE_NOTIFICATION_POLLER=false
    ports:
      - "8000:8000"
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  celery_beat:
    build:
      context: ./backend
    command: celery -A app.celery_app.celery_app beat --loglevel=INFO
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
