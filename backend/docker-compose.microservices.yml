x-backend-common: &backend-common
  build: .
  env_file:
    - .env
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg2://uplan:uplan@postgres:5432/uplan
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    ENABLE_NOTIFICATION_POLLER: "false"
    ENABLE_HSTS: ${ENABLE_HSTS:-false}
    GZIP_MINIMUM_SIZE_BYTES: ${GZIP_MINIMUM_SIZE_BYTES:-1000}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
    SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: uplan
      POSTGRES_USER: uplan
      POSTGRES_PASSWORD: uplan
    ports:
      - "5432:5432"
    volumes:
      - uplan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uplan -d uplan"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    <<: *backend-common
    command: uvicorn app.gateway.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
      AUTH_SERVICE_URL: http://auth-service:8009
      WORKSPACE_SERVICE_URL: http://workspace-service:8002
      PLANNING_SERVICE_URL: http://planning-service:8001
      TASK_ASSESSMENT_SERVICE_URL: http://task-assessment-service:8005
      COLLABORATION_SERVICE_URL: http://collaboration-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-30}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      auth-service:
        condition: service_started
      workspace-service:
        condition: service_started
      planning-service:
        condition: service_started
      task-assessment-service:
        condition: service_started
      collaboration-service:
        condition: service_started
      notification-service:
        condition: service_started

  auth-service:
    <<: *backend-common
    command: uvicorn app.microservices.auth.app:app --host 0.0.0.0 --port 8009
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10

  workspace-service:
