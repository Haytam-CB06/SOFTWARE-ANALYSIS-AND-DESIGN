    command: uvicorn app.microservices.workspaces.app:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10

  planning-service:
    <<: *backend-common
    command: uvicorn app.microservices.planner.app:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10

  task-assessment-service:
    <<: *backend-common
    command: uvicorn app.microservices.task_assessment.app:app --host 0.0.0.0 --port 8005
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10

  collaboration-service:
    <<: *backend-common
    command: uvicorn app.microservices.collaboration.app:app --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 10

  notification-service:
    <<: *backend-common
    command: uvicorn app.microservices.notifications.app:app --host 0.0.0.0 --port 8004
