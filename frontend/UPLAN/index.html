
  <!DOCTYPE html>
  <html lang="en" translate="no">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />


      <title>U PLAN</title>
      <style>
        html, body, #root { margin: 0; padding: 0; }
        html, body { background: white !important; }
        #root { background: white !important; display: block !important; visibility: visible !important; opacity: 1 !important; }
        .goog-te-banner-frame { display: none !important; }
        [translate="yes"] { translate: "no" !important; }
        #app-refresh-loader {
          position: fixed;
          inset: 0;
          z-index: 2147483647;
          display: grid;
          place-items: center;
          background: #ffffff;
          color: #0f172a;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          transition: opacity 220ms ease, visibility 220ms ease;
        }
        html.dark #app-refresh-loader {
          background: #020617;
          color: #f8fafc;
        }
        #app-refresh-loader.uplan-loader-hidden {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
        .uplan-loader-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 14px;
          text-align: center;
        }
        .uplan-loader-logo-shell {
          display: grid;
          height: 72px;
          width: 72px;
          place-items: center;
          border-radius: 20px;
          background: #ffffff;
          box-shadow: 0 16px 44px rgba(15, 23, 42, 0.12);
          animation: uplan-logo-breathe 1.8s ease-in-out infinite;
        }
        html.dark .uplan-loader-logo-shell {
          background: #0f172a;
          box-shadow: 0 16px 44px rgba(0, 0, 0, 0.34);
        }
        .uplan-loader-logo {
          height: 48px;
          width: 48px;
          border-radius: 14px;
          object-fit: cover;
        }
        .uplan-loader-title {
          margin: 0;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 0;
        }
        .uplan-loader-text {
          margin: 0;
          max-width: 240px;
          font-size: 13px;
          line-height: 1.5;
          color: #64748b;
        }
        html.dark .uplan-loader-text {
          color: #94a3b8;
        }
        .uplan-loader-dots {
          display: flex;
          gap: 6px;
          padding-top: 2px;
        }
        .uplan-loader-dots span {
          height: 6px;
          width: 6px;
          border-radius: 999px;
          background: #2563eb;
          animation: uplan-loader-dot 1.2s ease-in-out infinite;
        }
        .uplan-loader-dots span:nth-child(2) { animation-delay: 120ms; }
        .uplan-loader-dots span:nth-child(3) { animation-delay: 240ms; }
        @keyframes uplan-logo-breathe {
          0%, 100% { transform: translateY(0) scale(1); }
          50% { transform: translateY(-3px) scale(1.02); }
        }
        @keyframes uplan-loader-dot {
          0%, 100% { opacity: 0.35; transform: translateY(0); }
          50% { opacity: 1; transform: translateY(-3px); }
        }
      </style>
    </head>

    <body translate="no">
      <div id="app-refresh-loader" aria-label="Loading U PLAN">
        <div class="uplan-loader-card">
          <div class="uplan-loader-logo-shell">
            <img class="uplan-loader-logo" src="/android-chrome-192x192.png" alt="U PLAN" />
          </div>
          <p class="uplan-loader-title">U PLAN</p>
          <p class="uplan-loader-text">Getting your workspace ready.</p>
          <div class="uplan-loader-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
      <div id="root" translate="no"></div>
      <script type="module" src="/src/main.tsx"></script>
      <script>
        // Aggressive protection against Google Translate breaking React
        
        // 1. Mark root to never be translated
        const root = document.getElementById('root');
        if (root) {
          root.setAttribute('translate', 'no');
          root.style.visibility = 'visible';
          root.style.opacity = '1';
          root.style.display = 'block';
          root.style.backgroundColor = 'white';
        }
        
        // 2. Prevent hidden visibility
        const keepVisible = () => {
          document.documentElement.style.visibility = 'visible';
          document.documentElement.style.opacity = '1';
          document.documentElement.style.display = 'block';
          document.body.style.visibility = 'visible';
          document.body.style.opacity = '1';
          document.body.style.display = 'block';
          document.body.style.backgroundColor = 'white';
          if (root) {
            root.style.visibility = 'visible';
            root.style.opacity = '1';
            root.style.display = 'block';
          }
        };
        
        // 3. Check visibility frequently
        const visibilityCheck = setInterval(keepVisible, 50);
        
        // 4. Also monitor DOM mutations
        const observer = new MutationObserver((mutations) => {
          keepVisible();
          // If Google Translate added elements, restore them
          mutations.forEach(mutation => {
            if (mutation.type === 'attributes') {
              const target = mutation.target;
              if (target === document.documentElement || target === document.body || target === root) {
                // Reset critical styles
                if (target === document.documentElement) {
                  target.style.opacity = '1';
                  target.style.display = 'block';
                  target.style.visibility = 'visible';
                }
              }
            }
          });
        });
        
        observer.observe(document.documentElement, {
          attributes: true,
          subtree: true,
          attributeFilter: ['style', 'class', 'data-translated']
        });
        
        // 5. Prevent translation wrapper from hiding content
        window.googleTranslateElementInit = function() {
          keepVisible();
        };
        
        // 6. Stop translation from setting display:none
        const originalSetAttribute = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, value) {
          if (this.id === 'root' || this === document.body || this === document.documentElement) {
            if (name === 'style') {
              // Remove harmful display styles
              const cleanValue = value
                .replace(/display\s*:\s*none\s*(!important)?/gi, '')
                .replace(/opacity\s*:\s*0\s*(!important)?/gi, '')
                .replace(/visibility\s*:\s*hidden\s*(!important)?/gi, '');
              return originalSetAttribute.call(this, name, cleanValue);
            }
          }
          return originalSetAttribute.call(this, name, value);
        };
        
        // 7. Cleanup on page unload
        window.addEventListener('beforeunload', () => {
          clearInterval(visibilityCheck);
          observer.disconnect();
        });
      </script>
    </body>
  </html>
